<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduBase - Faculty</title>
<link rel="stylesheet" href="/style.css">
<script>
</script>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">🎓 EduBase</div>
  <ul class="nav-links">
    <li><a href="/index.html">Home</a></li>
    <li><a href="/students.html">Students</a></li>
    <li><a href="/faculty.html" class="active">Faculty</a></li>
    <li><a href="/report">Live Report</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>👩‍🏫 Faculty Records</h1>
</div>

<div class="content">

  <div id="msg-box" style="display:none"></div>

  <!-- Add Faculty Form -->
  <div class="form-card">
    <h2>➕ Add New Faculty</h2>
    <form id="add-faculty-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" id="f-name" placeholder="e.g. Dr. Prafull Sharma" required>
        </div>
        <div class="form-group">
          <label>Employee ID</label>
          <input type="text" name="emp_id" id="f-empid" placeholder="e.g. FAC2024001" required>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select name="dept" id="f-dept">
            <option>Computer Science</option>
            <option>Electronics</option>
            <option>Mechanical</option>
            <option>Civil</option>
            <option>Mathematics</option>
            <option>Physics</option>
          </select>
        </div>
        <div class="form-group">
          <label>Designation</label>
          <select name="designation" id="f-designation">
            <option>Professor</option>
            <option>Associate Professor</option>
            <option>Assistant Professor</option>
            <option>Lecturer</option>
            <option>HOD</option>
          </select>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" id="f-email" placeholder="faculty@college.edu">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" name="phone" id="f-phone" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label>Specialization</label>
          <input type="text" name="specialization" id="f-spec" placeholder="e.g. Data Structures, Networks">
        </div>
        <div class="form-group">
          <label>Experience (Years)</label>
          <input type="number" name="experience" id="f-exp" placeholder="e.g. 10" min="0">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Add Faculty</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </div>
    </form>
  </div>

  <!-- Faculty Table -->
  <div class="table-card">
    <h2>All Faculty</h2>
    <div id="faculty-table-container">
      <div class="empty-state"><div class="empty-icon">⏳</div>Loading...</div>
    </div>
  </div>
</div>

<script>
function showMsg(text, type) {
  const box = document.getElementById('msg-box');
  box.className = 'alert alert-' + type;
  box.textContent = text;
  box.style.display = 'block';
  setTimeout(() => box.style.display = 'none', 3000);
}

function loadFaculty() {
  fetch('/api/faculty')
    .then(r => r.json())
    .then(data => {
      const c = document.getElementById('faculty-table-container');
      if (!data.length) {
        c.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>No faculty found. Add one above!</div>';
        return;
      }
      let html = '<table><thead><tr><th>#</th><th>Name</th><th>Emp ID</th><th>Department</th><th>Designation</th><th>Specialization</th><th>Exp.</th><th>Email</th><th>Action</th></tr></thead><tbody>';
      data.forEach((f, i) => {
        html += `<tr>
          <td>${i+1}</td>
          <td><strong>${f.name}</strong></td>
          <td><span class="badge badge-teal">${f.emp_id}</span></td>
          <td>${f.dept}</td>
          <td><span class="badge badge-blue">${f.designation}</span></td>
          <td>${f.specialization || '—'}</td>
          <td>${f.experience ? f.experience + ' yrs' : '—'}</td>
          <td>${f.email || '—'}</td>
          <td><button class="btn btn-danger" onclick="deleteFaculty(${f.id})">🗑 Delete</button></td>
        </tr>`;
      });
      html += '</tbody></table>';
      c.innerHTML = html;
    })
    .catch(() => {
      document.getElementById('faculty-table-container').innerHTML =
        '<div class="empty-state"><div class="empty-icon">❌</div>Could not load faculty. Is the server running with MySQL?</div>';
    });
}

function deleteFaculty(id) {
  if (!confirm('Delete this faculty member?')) return;
  fetch('/api/delete_faculty', {
    method: 'POST',
    body: new URLSearchParams({ id: id })
  })
  .then(r => r.json())
  .then(d => { showMsg(d.message, d.status); loadFaculty(); });
}

document.getElementById('add-faculty-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const params = new URLSearchParams({
    name:           document.getElementById('f-name').value,
    emp_id:         document.getElementById('f-empid').value,
    dept:           document.getElementById('f-dept').value,
    designation:    document.getElementById('f-designation').value,
    email:          document.getElementById('f-email').value,
    phone:          document.getElementById('f-phone').value,
    specialization: document.getElementById('f-spec').value,
    experience:     document.getElementById('f-exp').value,
  });
  fetch('/api/add_faculty', {
    method: 'POST',
    body: params
  })
    .then(r => r.json())
    .then(d => { showMsg(d.message, d.status); if(d.status==='success') { this.reset(); loadFaculty(); }});
});

loadFaculty();
</script>
</body>
</html>
